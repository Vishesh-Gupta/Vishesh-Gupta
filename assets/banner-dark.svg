  <text x="48" y="58" class="mono rise" font-size="14" fill="#8b949e">~ $ whoami<tspan class="cursor" fill="#2C96C7"> ▍</tspan></text>
  <text x="46" y="112" class="sans rise d1" font-size="46" font-weight="700" fill="#e6edf3" letter-spacing="-1">Vishesh Gupta</text>
  <text x="48" y="146" class="sans rise d2" font-size="18" fill="#2C96C7" font-weight="600">Infrastructure Engineer @ Monoceros</text>
  <text x="48" y="172" class="mono rise d3" font-size="13" fill="#8b949e">cloud architecture · devops · site reliability</text>

