<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Vishesh Gupta, Infrastructure Engineer at Monoceros">
  <defs>
    <linearGradient id="trace" x1="0" x2="1">
      <stop offset="0" stop-color="#2C96C7" stop-opacity="0"/>
      <stop offset=".25" stop-color="#2C96C7"/>
      <stop offset=".75" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="898" height="238" rx="14"/></clipPath>
    <style>
      .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
      .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
      .trace { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 3.2s ease-out forwards; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .pulse { transform-origin: 806px 44px; animation: pulse 2s ease-out infinite; }
      .rise { opacity: 0; animation: rise .8s ease-out forwards; }
      .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(3.2); opacity: 0; } }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="238" rx="14" fill="#0d1117" stroke="#30363d"/>
